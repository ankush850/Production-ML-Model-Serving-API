services:
  api:
    build: .
    image: ml-serving-api:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # default to the local store; set MODEL_SOURCE=s3 for real AWS
      MODEL_SOURCE: ${MODEL_SOURCE:-local}
      LOCAL_MODEL_DIR: /app/models
    volumes:
      # serve the locally trained, timestamp-versioned artifacts
      - ./models/artifacts:/app/models:ro
    restart: unless-stopped
